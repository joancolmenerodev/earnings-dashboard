name: Generate Sectors Dashboard

on:
  schedule:
    - cron: '30 13 * * 1-5'
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate dashboard
        run: python sectors/generate.py

      - name: Commit updated dashboard
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sectors/index.html
          git diff --staged --quiet || git commit -m "chore: update sectors dashboard $(date +'%Y-%m-%d %H:%M')"
          git push
