name: Generate Earnings Dashboard

on:
  schedule:
    - cron: '0 6 * * 1'
    - cron: '0 20 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests yfinance

      - name: Generate dashboard
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python earnings/generate.py

      - name: Commit and push updated dashboard
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add earnings/index.html
          git diff --staged --quiet || git commit -m "chore: update earnings dashboard $(date +'%Y-%m-%d')"
          git push
